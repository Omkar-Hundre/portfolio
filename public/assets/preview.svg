<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Omkar Hundre portfolio preview</title>
  <desc id="desc">Clean social preview card for Omkar Hundre, Full Stack Software Engineer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef4ff" />
    </linearGradient>
    <radialGradient id="glow-blue" cx="0" cy="0" r="1" gradientTransform="translate(1020 104) rotate(90) scale(250 320)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-sky" cx="0" cy="0" r="1" gradientTransform="translate(180 560) rotate(90) scale(220 280)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fbff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <clipPath id="avatar-clip">
      <circle cx="915" cy="244" r="70" />
    </clipPath>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)" />
  <rect width="1200" height="627" fill="url(#glow-blue)" />
  <rect width="1200" height="627" fill="url(#glow-sky)" />

  <g filter="url(#shadow)">
    <rect x="72" y="76" width="1056" height="475" rx="30" fill="#ffffff" stroke="#dbe4f0" />
    <rect x="72" y="76" width="1056" height="58" rx="30" fill="#f8fafc" />
    <rect x="72" y="104" width="1056" height="30" fill="#f8fafc" />

    <circle cx="105" cy="105" r="6" fill="#cbd5e1" />
    <circle cx="128" cy="105" r="6" fill="#d7dee8" />
    <circle cx="151" cy="105" r="6" fill="#e2e8f0" />

    <rect x="393" y="88" width="414" height="34" rx="17" fill="#eef4fb" stroke="#e2e8f0" />
    <text x="600" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#475569">omkarhundre.in</text>

    <g transform="translate(126 170)">
      <rect x="0" y="0" width="136" height="36" rx="18" fill="#dbeafe" />
      <text x="68" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#1d4ed8">PORTFOLIO</text>

      <text x="0" y="92" font-family="Georgia, Times New Roman, serif" font-size="60" font-weight="700" fill="#0f172a">Omkar Hundre</text>
      <text x="0" y="132" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#334155">Full Stack Software Engineer</text>

      <text x="0" y="186" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#475569">I build and ship web apps from frontend to deployment.</text>
      <text x="0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#64748b">6 production apps, agency delivery, and hands-on infrastructure.</text>

      <g transform="translate(0 254)">
        <rect x="0" y="0" width="104" height="38" rx="19" fill="#eff6ff" stroke="#dbeafe" />
        <text x="52" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">React</text>

        <rect x="118" y="0" width="120" height="38" rx="19" fill="#eff6ff" stroke="#dbeafe" />
        <text x="178" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">Next.js</text>

        <rect x="252" y="0" width="116" height="38" rx="19" fill="#eff6ff" stroke="#dbeafe" />
        <text x="310" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">Node.js</text>

        <rect x="382" y="0" width="136" height="38" rx="19" fill="#eff6ff" stroke="#dbeafe" />
        <text x="450" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">Deployment</text>
      </g>

      <g transform="translate(0 326)">
        <rect x="0" y="0" width="516" height="110" rx="24" fill="#f8fbff" stroke="#e2e8f0" />
        <text x="28" y="38" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#94a3b8">WHAT YOU WILL FIND</text>
        <text x="28" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Projects, experience, and contact</text>
        <text x="28" y="96" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#64748b">A clear snapshot of shipped work and how I build.</text>
      </g>
    </g>

    <rect x="768" y="152" width="292" height="324" rx="30" fill="url(#panel)" stroke="#dbe4f0" />
    <rect x="792" y="176" width="96" height="30" rx="15" fill="#eff6ff" />
    <text x="840" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb">FEATURED</text>

    <circle cx="915" cy="244" r="74" fill="#ffffff" stroke="#dbe4f0" />
    <g clip-path="url(#avatar-clip)">
      <image href="me.png" x="845" y="174" width="140" height="140" preserveAspectRatio="xMidYMid slice" />
    </g>

    <text x="915" y="342" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" fill="#0f172a">Omkar here</text>
    <text x="915" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748b">Belagavi, India</text>

    <g transform="translate(792 396)">
      <rect x="0" y="0" width="244" height="50" rx="18" fill="#ffffff" stroke="#e2e8f0" />
      <circle cx="24" cy="25" r="6" fill="#2563eb" />
      <text x="40" y="22" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Projects</text>
      <text x="40" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Shipped client and product work</text>
    </g>

    <g transform="translate(792 455)">
      <rect x="0" y="0" width="244" height="50" rx="18" fill="#ffffff" stroke="#e2e8f0" />
      <circle cx="24" cy="25" r="6" fill="#38bdf8" />
      <text x="40" y="22" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Experience</text>
      <text x="40" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Frontend to deployment ownership</text>
    </g>
  </g>
</svg>
